# Original factorized FP32 reference: no claim of cache-consistent numerics.
[model]
model_name = "/models/Qwen3-VL-2B-Instruct/89644892e4d85e24eaac8bacfd4f463576704203"
dtype = "float32"
attn_implementation = "sdpa"

[model.portable_adapter]
directory = "/adapters/stock-factorized/portable"
execution_profile = "qwen3_vl_factorized_fp32_v1"
