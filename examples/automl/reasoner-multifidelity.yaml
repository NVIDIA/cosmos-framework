# Planning template. Replace assets/interpreter; review stages before launch.
search:
  experiment_id: reasoner-hyperband
  algorithm: hyperband
  seed: 42
  objective: {metric: overall.accuracy, direction: maximize}
  budget: {max_trials: 16, trial_timeout_seconds: 3600, total_timeout_seconds: 57600}
  fidelity: {minimum: 25, maximum: 100, reduction_factor: 2}
  parameters:
    optimizer.lr: {kind: float, low: 0.000001, high: 0.0001, log: true}
    optimizer.weight_decay: {kind: float, low: 0.0, high: 0.2}
  provenance:
    training_data: replace-with-immutable-training-data-revision
    validation_data: replace-with-immutable-validation-data-revision
    code_revision: replace-with-reviewed-framework-commit
workload:
  recipe: training.toml
  evaluation: evaluation.toml
  cwd: ../..
  nproc_per_node: 1
execution:
  kind: venv
  python: /path/to/framework-venv/bin/python
  gpu_devices: '0'
  environment: [BASE_CHECKPOINT_PATH]
