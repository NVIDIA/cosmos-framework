default_language_version:
  node: 25.2.1
  python: python3.13
# .agents/skills/{cookbooks,evaluation}/ include third-party code (VLMEvalKit,
# Apache-2.0); keep hooks off them until they are cleaned up.
exclude: (?x)(
    ^tests/data/|
    ^\.agents/skills/(cookbooks|evaluation)/
  )
repos:
  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense
        args: ["-f", "ci/license.txt"]
  - repo: https://github.com/jsh9/markdown-toc-creator
    rev: 0.1.3
    hooks:
      - id: markdown-toc-creator
        args: ["--config=ci/.markdown-toc-creator.toml"]
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.78
    hooks:
      - id: rumdl-fmt
        # Keep failures for violations that cannot be auto-fixed.
        entry: rumdl check --fix
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-symlinks
      - id: check-executables-have-shebangs
        exclude: /_src/
      - id: check-shebang-scripts-are-executable
        # Rendered templates carry a shebang but are not directly executable.
        exclude: /_src/|\.tmpl$
  - repo: local
    hooks:
      - id: uv-lock
        name: Generate uv lock files for projects
        entry: ./ci/uv_lock.sh
        language: script
        files: pyproject\.toml$
        # WSM is independently installed. The Posttrain lock is generated and
        # runtime-qualified by its pinned independent mapping flow.
        exclude: ^(?:\.agents/skills/cookbooks/cosmos3/simulation/auto/wsm/pyproject\.toml|docker/posttrain/environment/pyproject\.toml)$
      - id: uv-lock-script
        name: Generate uv lock files for scripts
        entry: ./ci/uv_lock_script.sh
        language: script
        types: [python]
      - id: spdx-openmdw
        name: SPDX identifier must be OpenMDW-1.1
        language: pygrep
        entry: 'SPDX-License-Identifier:\s+(?!OpenMDW-1\.1\b)'
        types: [python]
        files: ^cosmos_framework/
  - repo: https://github.com/tcort/markdown-link-check
    rev: v3.14.2
    hooks:
      - alias: link-check
        name: link check
        id: markdown-link-check
        args: [--config, "ci/.link-check.json", --quiet]
        stages: [manual]
        exclude: (?x)(
            \bATTRIBUTIONS\b|
            /_src/
          )
