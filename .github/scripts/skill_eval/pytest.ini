# Standalone pytest root for the orchestrator tests. Without it pytest would pick the repository's
# root conftest.py (which imports cosmos_framework/torch) — the stdlib-only runner cannot do that.
# `pythonpath = .` lets the tests `import run_matrix` directly.
[pytest]
pythonpath = .
testpaths = tests
addopts = -p no:cacheprovider
