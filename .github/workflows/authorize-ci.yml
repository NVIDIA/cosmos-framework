name: Authorize PR CI

on:
  workflow_call:

permissions:
  pull-requests: read

jobs:
  authorize:
    name: Verify repository access or head approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check repository permissions and approvals
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const eventPr = context.payload.pull_request;
            const params = { ...context.repo, pull_number: eventPr.number };
            const { data: pr } = await github.rest.pulls.get(params);
            if (pr.state !== 'open' || pr.base.ref !== eventPr.base.ref || pr.head.sha !== eventPr.head.sha) {
              throw new Error('This run no longer matches the current open PR.');
            }

            const canWrite = async (username) => {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo, username,
                });
                return ['admin', 'maintain', 'write'].includes(data.permission);
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            };
            if (await canWrite(pr.user.login) &&
                (context.actor === pr.user.login || await canWrite(context.actor))) return;

            // The API returns reviews in chronological order. A later change
            // request or dismissal supersedes an approval from the same reviewer.
            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...params, per_page: 100 });
            const decisions = new Map();
            for (const review of reviews) {
              if (review.user?.type === 'User' &&
                  ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) {
                decisions.set(review.user.login, review);
              }
            }
            for (const [reviewer, review] of decisions) {
              if (review.state === 'APPROVED' && review.commit_id === pr.head.sha &&
                  reviewer !== pr.user.login && await canWrite(reviewer)) return;
            }
            core.setFailed('PR CI requires a repository maintainer to approve this PR head, then select Re-run all jobs.');
