# Cosmos3-Nano GPU test suite on a self-hosted H200 runner.
#
# Every job is 4-GPU: each sets ``TEST_MAX_GPUS: "4"``, which is what
# ``cosmos_framework/inference/fixtures/args.py`` reads to build
# ``ALL_NUM_GPUS = (0, 1, MAX_GPUS)`` -- the set of widths ``--num-gpus`` and the
# ``gpus(N)`` markers may name. The env var and the ``--num-gpus`` flag must
# agree, or collection either errors on an out-of-range choice or deselects
# everything.
#
# A single ``pre-commit`` (lint) job runs first; the six GPU jobs all
# ``needs:`` it, so they wait on ONE pre-commit run and are skipped if lint
# fails — the single self-hosted runner is never spent on a lint-failing commit.
# The six GPU jobs then run (one at a time on the single runner):
#   * training-smoke                — Nano SFT pipeline (convert -> train 5 -> export -> t2i)
#   * generator-training-regression — vision_sft_nano loss vs goldens
#   * generator-inference-smoke     — Nano + Edge multi-modality inference (t2vs/t2v + policy + forward_dynamics) + Nano ModelOpt FP8
#   * distilled-inference-smoke     — Super 4-step T2I + I2V inference
#   * reasoner-inference-smoke      — Nano reasoner golden + Edge reasoner smoke + Qwen conversion coverage
#   * reasoner-training-regression  — llava_ov loss vs goldens
#
# Requires:
#   * a self-hosted runner labelled [self-hosted, gpu, h200] with at least 4
#     GPUs, NVIDIA drivers, and `uv` on PATH;
#   * an `HF_TOKEN` repository secret (gated dataset/model downloads, incl. the
#     streamed LLaVA-OneVision-Data dataset). The Nano ModelOpt FP8 cases also
#     need it to read nvidia/Cosmos3-Experimental, which is not public; they skip
#     (they do not fail) when it cannot.
#
# Inputs/checkpoints download to examples/ + the HF cache and are reused across
# runs (the h100 goldens are reused on H200 — see _detect_arch).
name: GPU Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: gpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single lint gate: runs once on ubuntu-latest; every GPU job below waits on it
  # and is skipped if it fails.
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml

  training-smoke:
    needs: pre-commit
    runs-on: [self-hosted, gpu, h200]
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      # 4-GPU SFT run. vision_sft_nano_5iter.toml sets
      # data_parallel_shard_degree = -1 (auto from WORLD_SIZE), so this is a
      # valid FSDP layout; each rank holds twice the shard it did at 8, which is
      # the memory headroom to watch if this job starts OOM-ing.
      TEST_MAX_GPUS: "4"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Sync environment (cu128-train)
        run: uv sync --all-extras --group=cu128-train

      # Full SFT pipeline: download + convert Nano->DCP, train 5 steps (loss
      # trend), export to HF safetensors, then a t2i generation from the export.
      # -s streams the live process log.
      - name: Nano SFT pipeline smoke (convert -> train 5 -> export -> t2i, 4 GPU)
        run: |
          export LD_LIBRARY_PATH=
          uv run --all-extras --group=cu128-train python -m pytest -v -s \
            tests/nano_training_smoke_test.py --num-gpus=4 --levels=2 -o addopts=

      # Clear the heavy artifacts (even on failure): examples/checkpoints (the
      # Cosmos3-Nano DCP + Wan VAE, ~30 GB) and the pytest tmp dirs (the SFT
      # checkpoint + logs). The small examples/data dataset and the HF cache are
      # intentionally kept so subsequent runs reuse them.
      - name: Clean up run outputs
        if: always()
        run: |
          rm -rf examples/checkpoints || true
          rm -rf "${TMPDIR:-/tmp}"/pytest-of-* /tmp/pytest-of-* || true

  generator-training-regression:
    needs: pre-commit
    runs-on: [self-hosted, gpu, h200]
    timeout-minutes: 75
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      # Select the 4-GPU regression test variant.
      TEST_MAX_GPUS: "4"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Sync environment (cu128-train)
        run: uv sync --all-extras --group=cu128-train

      # Generator (vision_sft_nano) loss vs the h100 goldens, plus a Nano DCP ->
      # Diffusers conversion that validates the exported component files and indexes.
      # Both tests share the module-scoped staged Nano DCP. -s streams the live log.
      - name: Generator regression and Nano Diffusers export (4 GPU)
        run: |
          export LD_LIBRARY_PATH=
          uv run --all-extras --group=cu128-train python -m pytest -v -s \
            tests/launch_regression_test.py -k 'vision_sft_nano or convert_model_to_diffusers' \
            --num-gpus=4 --levels=2 -o addopts=

      # The h100_inputs fixture removes its DCP stage on teardown; clear the
      # pytest tmp dirs too (logs + any run output). The HF cache is kept.
      - name: Clean up run outputs
        if: always()
        run: |
          rm -rf "${TMPDIR:-/tmp}"/pytest-of-* /tmp/pytest-of-* || true

  generator-inference-smoke:
    needs: pre-commit
    runs-on: [self-hosted, gpu, h200]
    # 105 (not 60) since the Nano step gained the three ModelOpt FP8 cases (two
    # parallelism layouts + mixed-precision diffusion steps): a 20 GB checkpoint
    # on a cold cache plus three more full-width runs.
    timeout-minutes: 105
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      # Both steps use the `throughput` preset, whose layout is derived from
      # world_size (cfgp=1, cp=1, dp_shard=world_size), so the width is free.
      TEST_MAX_GPUS: "4"
      # This is the job whose stated purpose includes FP8 coverage: promote the
      # cannot-reach-nvidia/Cosmos3-Experimental skip to a hard failure, so a
      # token rotation or a permissions change turns the job red instead of
      # silently dropping all three FP8 cases. Forks and local runs (which do
      # not set this) keep the skip behaviour.
      REQUIRE_FP8: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Sync environment (cu128-train)
        run: uv sync --all-extras --group=cu128-train

      # One inference call over t2vs (+sound), action policy, and forward_dynamics; checks each output.
      # Plus the ModelOpt static-FP8 Nano checkpoint in both parallelism layouts
      # (FSDP-sharded and replicated) and once more with FP8 mixed-precision
      # diffusion steps (W8A16 edge steps; exact schedule asserted from the
      # MIXED_PRECISION_TRACE log). The FP8 checkpoint lives in the
      # access-controlled nvidia/Cosmos3-Experimental repo; elsewhere those three
      # cases SKIP unless HF_TOKEN can read it, but REQUIRE_FP8=1 above makes the
      # skip a hard failure here, so a green run is guaranteed to have covered FP8.
      # -s streams the live process log.
      # Reuse the same input-asset cache dir as the unittest job.
      - name: Nano inference smoke (t2vs + action policy + forward_dynamics + FP8, 4 GPU)
        run: |
          export LD_LIBRARY_PATH=
          export COSMOS_DOWNLOAD_CACHE_DIR="$RUNNER_WORKSPACE/cosmos_input_cache"
          uv run --all-extras --group=cu128-train python -m pytest -v -s \
            tests/nano_inference_smoke_test.py --num-gpus=4 --levels=2 -o addopts=

      # Same three-modality smoke on the smaller Cosmos3-Edge checkpoint: a plain
      # t2v (Edge has no sound, so t2vs is swapped for t2v and its 480/121/24
      # generation defaults are asserted) plus action policy + forward_dynamics.
      # Reuses the same input-asset cache dir; the Edge checkpoint downloads once
      # and is reused afterward.
      - name: Edge inference smoke (t2v + action policy + forward_dynamics, 4 GPU)
        run: |
          export LD_LIBRARY_PATH=
          export COSMOS_DOWNLOAD_CACHE_DIR="$RUNNER_WORKSPACE/cosmos_input_cache"
          uv run --all-extras --group=cu128-train python -m pytest -v -s \
            tests/edge_inference_smoke_test.py --num-gpus=4 --levels=2 -o addopts=

      # Inference writes only the pytest tmp dir (the t2vs video + logs); the
      # checkpoint download stays in the HF cache (kept). No examples/ artifacts.
      - name: Clean up run outputs
        if: always()
        run: |
          rm -rf "${TMPDIR:-/tmp}"/pytest-of-* /tmp/pytest-of-* || true

  distilled-inference-smoke:
    needs: pre-commit
    runs-on: [self-hosted, gpu, h200]
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      # The distilled Super checkpoints use a four-way data-parallel shard.
      TEST_MAX_GPUS: "4"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Sync environment (cu128-train)
        run: uv sync --all-extras --group=cu128-train

      # Launch both pinned public four-step checkpoints through the real CLI.
      # Validate FixedStep selection and decoded image/video content.
      - name: Distilled Super inference smoke (T2I + I2V, 4 GPU)
        run: |
          export LD_LIBRARY_PATH=
          export COSMOS_DOWNLOAD_CACHE_DIR="$RUNNER_WORKSPACE/cosmos_input_cache"
          uv run --all-extras --group=cu128-train python -m pytest -v -s \
            tests/distilled_inference_smoke_test.py \
            --num-gpus=4 --levels=2 -o addopts=

      # Keep downloaded model artifacts in the persistent HF cache, but remove
      # generated media and logs even when an inference case fails.
      - name: Clean up run outputs
        if: always()
        run: |
          rm -rf "${TMPDIR:-/tmp}"/pytest-of-* /tmp/pytest-of-* || true

  reasoner-inference-smoke:
    needs: pre-commit
    runs-on: [self-hosted, gpu, h200]
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      # 4-GPU reasoner inference test; the gpus(4) marker
      # requires MAX_GPUS == 4.
      TEST_MAX_GPUS: "4"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Sync environment (cu128-train)
        run: uv sync --all-extras --group=cu128-train

      # Image-conditioned Cosmos3-Nano reasoner inference: compare the first
      # decoded token's logits against a committed golden (exact argmax +
      # allclose rtol/atol=1e-3). -s streams the live process log. The text-only
      # variant lives in the same file but is not exercised in CI. Cache the
      # downloaded image asset (reasoner_image.json's remote vision_path) in the
      # persistent input-asset dir shared with the generator-inference-smoke job.
      - name: Nano reasoner inference (image-conditioned first-token logits golden, 4 GPU)
        run: |
          export LD_LIBRARY_PATH=
          export COSMOS_DOWNLOAD_CACHE_DIR="$RUNNER_WORKSPACE/cosmos_input_cache"
          uv run --all-extras --group=cu128-train python -m pytest -v -s \
            tests/nano_reasoner_inference_smoke_test.py::test_nano_reasoner_image_first_token_logits \
            --num-gpus=4 --levels=2 -o addopts=

      # Image-conditioned Cosmos3-Edge reasoner inference at smoke level: assert a
      # non-empty reasoner_text (no per-checkpoint logits golden, unlike the Nano
      # case above). Edge's Nemotron reasoner is vision-capable. Reuse the shared
      # input-asset cache dir for reasoner_image.json's remote vision_path.
      - name: Edge reasoner inference smoke (image-conditioned reasoner_text, 4 GPU)
        run: |
          export LD_LIBRARY_PATH=
          export COSMOS_DOWNLOAD_CACHE_DIR="$RUNNER_WORKSPACE/cosmos_input_cache"
          uv run --all-extras --group=cu128-train python -m pytest -v -s \
            tests/edge_reasoner_inference_smoke_test.py::test_edge_reasoner_image_reasoner_text \
            --num-gpus=4 --levels=2 -o addopts=

      # Merge Cosmos3-Nano into the public Qwen3-VL shell and verify that every
      # Qwen tensor is present and both the vision and language towers come from
      # Cosmos3-Nano. The exact node ID avoids collecting the training regressions
      # in the same file.
      - name: Nano reasoner Qwen tensor conversion coverage (4 GPU collection)
        run: |
          export LD_LIBRARY_PATH=
          uv run --all-extras --group=cu128-train python -m pytest -v -s \
            tests/launch_regression_test.py::test_convert_reasoner_converts_all_qwen_tensors \
            --num-gpus=4 --levels=2 -o addopts=

      # Reasoner inference and conversion write to pytest tmp dirs (generated
      # text, logs, and the merged checkpoint); downloaded checkpoints stay in
      # the HF cache (kept).
      - name: Clean up run outputs
        if: always()
        run: |
          rm -rf "${TMPDIR:-/tmp}"/pytest-of-* /tmp/pytest-of-* || true

  reasoner-training-regression:
    needs: pre-commit
    runs-on: [self-hosted, gpu, h200]
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      # Select the 4-GPU regression test variant.
      TEST_MAX_GPUS: "4"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Sync environment (cu128-train)
        run: uv sync --all-extras --group=cu128-train

      # Reasoner (llava_ov) loss vs the h100 goldens. -s streams the live log.
      - name: Reasoner regression (llava_ov, 4 GPU)
        run: |
          export LD_LIBRARY_PATH=
          uv run --all-extras --group=cu128-train python -m pytest -v -s \
            tests/launch_regression_test.py -k llava_ov \
            --num-gpus=4 --levels=2 -o addopts=

      # The h100_inputs fixture removes its DCP stage on teardown; clear the
      # pytest tmp dirs too (logs + any run output). The HF cache is kept.
      - name: Clean up run outputs
        if: always()
        run: |
          rm -rf "${TMPDIR:-/tmp}"/pytest-of-* /tmp/pytest-of-* || true

  # Co-located unit tests: every *_test.py under cosmos_framework/ (CPU and GPU
  # together) in one pytest invocation, plus two torchrun steps for the
  # distributed tests that hardcode their world size. Runs parallel to the five
  # jobs above (all gated on the single pre-commit lint).
  unittest:
    needs: pre-commit
    runs-on: [self-hosted, gpu, h200]
    # 60 (not 30) so the first cold-cache run can download the Cosmos3-Nano
    # checkpoint for scripts/_test's convert->export->inference pipeline; steady
    # state (warm HF cache) is a few minutes.
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_XET: "1"
      # This job passes no --num-gpus, so it only collects the gpus(0)/gpus(1)
      # cases either way. Pinning the width anyway keeps the whole workflow on
      # one ALL_NUM_GPUS, so a gpus(8) marker added later fails collection here
      # rather than passing lint and dying on the runner.
      TEST_MAX_GPUS: "4"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Sync environment (cu128-train)
        run: uv sync --all-extras --group=cu128-train

      # Run the whole co-located suite (CPU + GPU). Tests that load internal
      # pretrained weights from S3 skip themselves when credentials/pretrained.secret
      # is absent (via RunIf / pytest.skip guards), so this is green without
      # internal credentials; provide the credential file on the runner to
      # exercise them. New tests are picked up automatically (no markers/lists).
      # Cache downloaded input assets in a persistent dir (outside the repo tree,
      # so the cleanup step keeps it) and reuse it across runs.
      - name: Unit tests
        run: |
          export LD_LIBRARY_PATH=
          export COSMOS_DOWNLOAD_CACHE_DIR="$RUNNER_WORKSPACE/cosmos_input_cache"
          uv run --all-extras --group=cu128-train python -m pytest -v -s \
            cosmos_framework/ -o addopts= \
            --deselect cosmos_framework/model/generator/mot/attention_test.py::test_two_way_attention_flex_matches_dense_across_batch_shapes

      # Deselected above and run here instead, in a process of its own.
      #
      # NATTEN's fused-NA knobs are process-global, and
      # cosmos_framework/model/attention/natten/functions.py turns them on at import time
      # (set_memory_usage_preference("unrestricted"), use_kv_parallelism_in_fused_na(True))
      # without ever putting them back. Once test_two_way_attention_vs_three_way_attention --
      # the one test that dispatches to NATTEN -- has run in a process, this test's
      # [triton-compile-dynamic] case comes back with NaN for dk across the second sample's
      # whole UND span (17920/141312 elements, first at index (322, 0, 0)). It passes on its
      # own, on both H100 and H200, so the two are coupled through process state rather than
      # through anything either one computes.
      #
      # Resetting those knobs between the two tests does clear it, but only from a plugin
      # loaded with -p; the same code in a conftest, a fixture finaliser or a trylast hook
      # does not, which is not understood well enough to land as a fix. Separate processes
      # are what the coupling cannot cross. Tracked in #179.
      #
      # The test itself arrives with #179, so on a branch that predates it there is nothing
      # to run: a node id pytest cannot collect is a usage error (exit 4), not an empty run,
      # which would fail this job on main until #179 lands. The grep is against the source
      # rather than a --collect-only probe so that an import error still fails loudly
      # instead of reading as "not there yet". The --deselect above needs no such guard;
      # it is a no-op when nothing matches.
      - name: Unit tests - two_way_attention flex vs dense (separate process)
        run: |
          export LD_LIBRARY_PATH=
          export COSMOS_DOWNLOAD_CACHE_DIR="$RUNNER_WORKSPACE/cosmos_input_cache"
          test_file=cosmos_framework/model/generator/mot/attention_test.py
          test_name=test_two_way_attention_flex_matches_dense_across_batch_shapes
          if ! grep -q "def $test_name" "$test_file"; then
            echo "::notice::$test_name is not on this branch yet (arrives with #179); nothing to run."
            exit 0
          fi
          uv run --all-extras --group=cu128-train python -m pytest -v -s \
            "$test_file::$test_name" -o addopts=

      # The cfgp_ar / context_parallel tests call dist.init_process_group and
      # skip under plain pytest (world_size 1); they must be launched with
      # torchrun. They hardcode their world size via ParallelDims, so each file
      # needs the matching --nproc_per_node and they cannot share one launch:
      #   * cfgp_ar          -> cfgp=2,  dp_shard=1  => world_size must be 2
      #   * context_parallel -> cp=4 (and cp=world_size) => world_size must be 4
      # Over-provisioning (e.g. 8) makes ParallelDims' product != world_size and
      # fails, so these sizes are fixed, not "the more GPUs the better".
      - name: Distributed unit tests - cfgp_ar (torchrun, 2 ranks)
        run: |
          export LD_LIBRARY_PATH=
          uv run --all-extras --group=cu128-train torchrun --nproc_per_node=2 -m pytest -v \
            cosmos_framework/model/generator/mot/cfgp_ar_test.py -o addopts=

      - name: Distributed unit tests - context_parallel (torchrun, 4 ranks)
        run: |
          export LD_LIBRARY_PATH=
          uv run --all-extras --group=cu128-train torchrun --nproc_per_node=4 -m pytest -v \
            cosmos_framework/model/generator/mot/context_parallel_test.py -o addopts=

      # Clear everything the suite writes into the working tree (all gitignored
      # scratch): pytest tmp dirs (DCP checkpoint, logs), the script-test
      # `outputs/` dir, any `examples/checkpoints`, and the `schemas/` dir from
      # export_schemas_test. The HF cache lives outside the tree and is kept for
      # reuse across runs. Runs on success or failure.
      - name: Clean up run outputs
        if: always()
        run: |
          rm -rf "${TMPDIR:-/tmp}"/pytest-of-* /tmp/pytest-of-* \
            outputs examples/checkpoints schemas || true
