name: Validate standalone WSM
on:
  push:
    paths: ['.agents/skills/cookbooks/cosmos3/simulation/auto/wsm/**', '.github/workflows/validate-wsm.yml', '.gitattributes', '.pytest.toml']
  pull_request:
    paths: ['.agents/skills/cookbooks/cosmos3/simulation/auto/wsm/**', '.github/workflows/validate-wsm.yml', '.gitattributes', '.pytest.toml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_GPU_TESTS: "0"
      WSM_DIR: .agents/skills/cookbooks/cosmos3/simulation/auto/wsm
    steps:
      - uses: actions/checkout@v6
      - name: Fetch standalone WSM scene and documentation resources
        run: git lfs pull --include="$WSM_DIR/examples/rds_hq/**,$WSM_DIR/docs/images/wsm4/**" --exclude=''
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install build pytest ruff
      - run: python "$WSM_DIR/tools/check_portability.py"
      - run: python -m build "$WSM_DIR" --outdir artifacts
      - run: python "$WSM_DIR/tools/check_portability.py" artifacts/*.whl artifacts/*.tar.gz
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install artifacts/*.whl
      - run: python -m pytest -q -c "$WSM_DIR/pyproject.toml" --confcutdir="$WSM_DIR" "$WSM_DIR/tests" "$WSM_DIR/skills/scenario-to-rds-hq/evals"
      - run: ruff check --select F821 "$WSM_DIR"
