  - .agents/skills/cookbooks/cosmos3/nim/api-reference.md
  - .agents/skills/cookbooks/cosmos3/nim/bring-your-own-checkpoint.md
  - .agents/skills/cookbooks/cosmos3/nim/configuration.md
  - .agents/skills/cookbooks/cosmos3/nim/deployment.md
  - .agents/skills/cookbooks/cosmos3/nim/generation.md
  - .agents/skills/cookbooks/cosmos3/nim/helm.md
  - .agents/skills/cookbooks/cosmos3/nim/operations.md
  - .agents/skills/cookbooks/cosmos3/nim/prerequisites.md
  - .agents/skills/cookbooks/cosmos3/nim/reasoning.md
  - .agents/skills/cookbooks/cosmos3/nim/release-notes.md
  - .agents/skills/cookbooks/cosmos3/nim/support-matrix.md
  - .agents/skills/cookbooks/cosmos3/nim/transfer.md

# Not ready for publication: not rendered and not linked.
hold:
  - docs/transfer_numerical_preservation.md
  - docs/posttrain/reference/compatibility.md
  # These simulation pages clone the code from a fork; publish once they use this repo.
  - .agents/skills/cookbooks/cosmos3/simulation/auto/auto.md
  - .agents/skills/cookbooks/cosmos3/simulation/transfer/transfer.md

# Repo-only pages: links to them go to GitHub.
not_on_site:
  # Design proposal; runtime support and qualification remain pending.
  - docs/post_training/qlora_native_vlm_design.md
  # How to maintain the docs, for doc developers.
  - docs/README.md
  # AutoML guides.
  - docs/automl.md
  - docs/automl-*.md
  # Posttrain SFT guide; the site's SFT section covers SFT.
  - docs/posttrain/guides/sft.md
  # Joint PPO for GR00T / pi0.5 policies and their simulator integration.
  - docs/posttrain/guides/joint-ppo-*.md
  - docs/posttrain/howto/sim-integration.md
  - docs/posttrain/reference/embodied.md
