# Run to completion before starting workers. Use the same image, profile
# selectors, cache, and compatible GPU class as the worker deployment.
apiVersion: batch/v1
kind: Job
metadata:
  name: cosmos3-reasoner-model-download
  labels:
    app.kubernetes.io/name: cosmos3-reasoner
    app.kubernetes.io/component: model-download
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cosmos3-reasoner
        app.kubernetes.io/component: model-download
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ngc-registry-secret
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: model-download
          image: nvcr.io/nim/nvidia/cosmos3:2.1.0
          imagePullPolicy: IfNotPresent
          workingDir: /opt/nim
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              selection_env="$(mktemp)"
              cleanup() { rm -f "$selection_env"; }
              trap cleanup EXIT

              /opt/nim/.venv/bin/python -m profile_selection.startup \
                --output "$selection_env"
              # shellcheck disable=SC1090
              . "$selection_env"
              export BACKEND_TYPE NIM_MODEL_PROFILE COSMOS_MODEL_TYPE

              /opt/nim/.venv/bin/python -c \
                'from nimlib import nimutils; nimutils.download_models(nimutils.get_model_manifest())'
              echo "Cosmos reasoner artifacts are present in $NIM_CACHE_PATH"
          envFrom:
            - secretRef:
                name: ngc-api-secret
          env:
            - name: NIM_MODEL_TYPE
              value: reasoner
            - name: NIM_DYNAMO_WORKER
              value: 'true'
            - name: NIM_MODEL_VARIANT
              value: nano
            - name: NIM_PRECISION
              value: fp8
            - name: NIM_TAGS_SELECTOR
              value: n_gpus=1,nim_tp=1,nim_dp=1
            - name: NIM_CACHE_PATH
              value: /opt/nim/.cache
          resources:
            requests:
              cpu: '4'
              memory: 16Gi
              nvidia.com/gpu: '1'
            limits:
              cpu: '8'
              memory: 32Gi
              nvidia.com/gpu: '1'
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
      volumes:
        - name: nim-cache
          persistentVolumeClaim:
            claimName: nim-model-cache
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
