[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-auto-wsm"
version = "0.1.0"
description = "Standalone WSM4 reference renderer for Cosmos Transfer Auto"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-OpenMDW-1.1"
license-files = ["LICENSE"]
dependencies = [
    "boto3", "botocore", "einops", "hydra-core>=1.3",
    "imageio[ffmpeg]", "minio", "moderngl>=5.10", "mpire",
    "numpy>=1.26", "omegaconf", "opencv-python-headless",
    "python-pycg>=0.7", "ray>=2.40", "scipy", "shapely>=2.1",
    "safetensors", "termcolor", "torch>=2.0", "tqdm", "trimesh", "webdataset",
]

[project.scripts]
cosmos-auto-wm = "cosmos_auto.wm.cli:main"
cosmos-auto-lidar-rangemap = "cosmos_auto.lidar.cli:main"

[project.optional-dependencies]
dev = ["build", "pytest", "ruff"]
video = ["decord"]
pointcloud = ["open3d"]
lidar-vis = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cosmos_auto*"]
namespaces = true

[tool.setuptools.package-data]
"cosmos_auto.lidar" = ["assets/*.json"]
"cosmos_auto.wm" = ["assets/**/*.json", "assets/**/*.tar", "color_scheme/*.json", "conf/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "skills/scenario-to-rds-hq/evals"]
markers = [
    "L0: fast semantic tests",
    "L1: extended tests",
    "CPU: does not require a GPU",
    "GPU: requires a GPU and EGL",
]

[tool.ruff.lint]
select = ["F821"]
